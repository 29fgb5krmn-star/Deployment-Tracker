<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deployment Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Deployment Tracker</h1>
    <p>Store Deployment Overview</p>
  </header>


  <main class="container">

    <!-- =========================
         OVERVIEW PAGE
    ========================== -->

    <div id="overviewPage">

      <!-- SUMMARY -->

      <section class="summary">

        <div class="summary-card">
          <h3>Total Stores</h3>
          <strong id="totalStores">12</strong>
        </div>

        <div class="summary-card">
          <h3>In Progress</h3>
          <strong id="inProgress">0</strong>
        </div>

        <div class="summary-card">
          <h3>Completed</h3>
          <strong id="completed">0</strong>
        </div>

        <div class="summary-card">
          <h3>Checked In</h3>
          <strong id="checkedIn">0</strong>
        </div>

      </section>


      <!-- STORE OVERVIEW -->

      <section class="section">

        <div class="section-title">

          <div>
            <h2>Deployment Overview</h2>

            <p>
              Monitor stores, technicians,
              deployment progress and check-in.
            </p>
          </div>

        </div>


        <div
          id="storeGrid"
          class="store-grid"
        ></div>

      </section>


      <!-- RECENT UPDATES -->

      <section
        id="recentUpdatesSection"
        class="section"
      >

        <div class="section-title">

          <div>

            <h2>Recent Updates</h2>

            <p>
              Latest deployment activities.
            </p>

          </div>

        </div>


        <div
          id="recentUpdates"
        ></div>

      </section>

    </div>


    <!-- =========================
         STORE DETAIL PAGE
    ========================== -->

    <div
      id="storeDetailPage"
      style="display: none;"
    >

      <section
        id="storeDetail"
        class="section store-detail"
      ></section>

    </div>

  </main>


  <script src="script.js"></script>

</body>

</html>
