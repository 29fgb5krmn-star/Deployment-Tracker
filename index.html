<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deployment Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div>
    <h1>Deployment Tracker</h1>
    <span>Store Deployment Overview</span>
  </div>
</header>

<main class="container">

  <!-- SUMMARY -->
  <section class="summary">
    <div class="summary-card">
      <p>Total Stores</p>
      <h2 id="totalStores">12</h2>
    </div>

    <div class="summary-card">
      <p>In Progress</p>
      <h2 id="inProgress">0</h2>
    </div>

    <div class="summary-card">
      <p>Completed</p>
      <h2 id="completed">0</h2>
    </div>

    <div class="summary-card">
      <p>Checked In</p>
      <h2 id="checkedIn">0</h2>
    </div>
  </section>

  <!-- STORE OVERVIEW -->
  <section class="section">
    <h2>Store Deployment</h2>

    <div id="storeGrid" class="store-grid">
      <!-- Store cards will be generated by JavaScript -->
    </div>
  </section>

  <!-- STORE DETAIL -->
  <section
    id="storeDetail"
    class="section store-detail"
    style="display: none;"
  >
    <!-- Store detail will be generated by JavaScript -->
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
